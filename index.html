    case 'khaled': row = P(f.a) + arr(ic('hands')) + P(f.b); head = `${whoIs(f.a)} ${mineA ? 'نشلت' : 'نشل'} ${f.n === 1 ? 'ورقة' : 'ورقتين'} ${of(f.b)}`; sub = 'الحرامي ما يطلع إيده فاضية'; snd = 'draw'; break;
    case 'ali': row = P(f.b) + arr() + `<span class="as-card">${cardBig(0, 'ACC', 'static')}</span>` + arr() + P(f.d); head = `${whoIs(f.a)} ${mineA ? 'أشعلت' : 'أشعل'} الفتنة!`; sub = `${accN(f.n)} ${f.n > 10 ? 'انتقل' : 'انتقلت'} من ${f.b === me ? 'عليك' : 'على ' + nk(f.b)} إلى ${f.d === me ? 'عليك' : nk(f.d)}`; snd = 'acc'; break;
    case 'hamad': row = P(f.a); head = 'العفو العام!'; sub = `${mineA ? 'عفيت' : 'العم حمد عفا'} عن الكل: ${accN(f.n)} ${f.n > 10 || f.n === 1 ? 'انحرق' : 'انحرقت'}`; snd = 'good'; break;
    case 'nawaf': row = P(f.a); head = `${f.a === me ? 'أنت جدار' : nk(f.a) + ' جدار'}!`; sub = 'وصلت الاتهامات للحد وانكسرت عليه: انحرقت كلها وما انكشف شي'; snd = 'shield'; break;
    case 'noura': row = (f.a >= 0 ? P(f.a) + arr(ic('plus')) : '') + P(f.b); head = `نورة الطبيبة ${f.b === me ? 'أنقذتك' : 'أنقذت ' + nk(f.b)}!`; sub = 'الخونة اغتالوه… بس كانت معالجته بالسر'; snd = 'good'; break;
    case 'abdullah': row = P(f.a); head = `${f.a === me ? 'قمت' : nk(f.a) + ' قام'} من الموت!`; sub = 'أبو سبعة أرواح: الخونة اغتالوه وما مات'; snd = 'shield'; break;
    default: return null;
  }
  return { ms: 2600, snd, buzz: f.b === me || f.d === me, html: asWrap('ab', `<p class="as-k" style="--cc:${CHAR_COLOR[f.c]}">${ic('sparkle')} ${c.n} · ${c.t}</p><div class="as-row">${row}</div><h3>${head}</h3><p class="as-s">${sub}</p>`) };
}
function runFx() {
  const pub = S.pub, fx = pub && pub.fx;
  if (!fx || S.mode !== 'game') return;
  const mx = fx.reduce((m, f) => Math.max(m, f.i), 0);
  if (S.ui.seenFx == null || S.ui.seenFx < 0 || mx < S.ui.seenFx) { S.ui.seenFx = mx; S.ui.lastTn = pub.tn; return; }
  const news = fx.filter((f) => f.i > S.ui.seenFx);
  S.ui.seenFx = mx;
  for (const f of news) if (f.k === 'reveal') queueReveal(f);
  // what happened, big on every screen: plays, draws (grouped), black cards, peeks; then whose turn it is
  for (let k = 0; k < news.length; k++) {
    const f = news[k];
    if (f.k === 'play') queueShow(playShow(f));
    else if (f.k === 'black') queueShow(blackShow(f));
    else if (f.k === 'peek') queueShow(peekShow(f));
    else if (f.k === 'ab') queueShow(abShow(f));
    else if (f.k === 'draw') { let n = 1; while (news[k + 1] && news[k + 1].k === 'draw' && news[k + 1].a === f.a) { n++; k++; } queueShow(drawShow(f.a, n)); }
  }
  if (pub.ph === 'turn' && pub.tn != null && S.ui.lastTn != null && pub.tn > S.ui.lastTn) queueShow(turnShow(pub.turn));
  if (pub.tn != null) S.ui.lastTn = pub.tn;
  if (reduced() || !news.length) return;
  news.slice(-5).forEach((f, k) => setTimeout(() => { try { animate(f); } catch (e) { /* element gone */ } }, k * 200));
}
/* ================= events ================= */
function seatTap(pid) {
  const pub = S.pub;
  const m = tableMode();
  if (m && tokTargetable(m, pid) === '') {
    if (m.k === 'will') { if (S.pub.pd && S.pub.pd.tg == null) doAct({ t: 'will', target: pid }); return render(); }
    if (m.k === 'steal' || m.k === 'heal') { doAct({ t: m.k, target: pid }); S.ui.tg = null; return render(); }
    if (m.k === 'fitna') {
      if (m.step === 0) { S.ui.tg = { k: 'fitna', step: 1, t1: pid }; return render(); }
      doAct({ t: 'fitna', target: m.t1, target2: pid }); S.ui.tg = null; return render();
    }
    if (m.k === 'dpick') return doAct({ t: 'dpick', target: pid });
    if (m.k === 'npick') {
      const pv = S.priv;
      const cur = Object.assign({}, pv.mp || {}, S.ui.sel2);
      cur[m.role] = pid; S.ui.sel2 = cur;
      if (pv.w && pv.cn && m.role === 'kill' && cur.prot == null) S.ui.nrole = 'prot';
      const need = [pv.w ? 'kill' : null, pv.cn ? 'prot' : null].filter(Boolean);
      if (need.every((k) => cur[k] != null)) doAct({ t: 'npick', kill: cur.kill, prot: cur.prot });
      return render();
    }
    if (m.k === 'peek') { doAct({ t: 'peek', target: pid }); S.ui.tg = null; return render(); }
    if (m.k === 'card') {
      const tg = m;
      if ((tg.t === 'ROB' || tg.t === 'SCA') && tg.step === 0) { S.ui.tg = Object.assign({}, tg, { step: 1, t1: pid }); return render(); }
      if (tg.t === 'CUR') {
        const bl = pl(pid).fr.map((f, k) => ({ f, k })).filter((x) => x.f === 'CAT' || LE.BLUE[x.f]);
        if (bl.length > 1) { S.ui.sheet = { k: 'curpick', id: tg.id, t1: pid }; S.ui.tg = null; return render(); }
        doAct({ t: 'play', card: tg.id, target: pid, c2i: bl[0].k }); S.ui.tg = null; return render();
      }
      if (tg.step === 1) doAct({ t: 'play', card: tg.id, target: tg.t1, target2: pid });
      else doAct({ t: 'play', card: tg.id, target: pid });
      S.ui.tg = null; return render();
    }
  }
  if (m && m.k === 'card') { const why = tokTargetable(m, pid); if (why && why !== 'لا') toast(why); return; }
  if (pid === meId() && S.priv) { S.ui.sheet = { k: 'mine' }; return render(); }
  S.ui.sheet = { k: 'seat', pid }; render();
}
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  const pid = el.dataset.pid != null ? +el.dataset.pid : null;
  const pub = S.pub, me = meId();
  switch (act) {
    case 'host': saveNick(); hostCreate(); break;
    case 'join': saveNick(); S.ui.joinCode = latinDigits((document.getElementById('joinCode') || {}).value).replace(/\D/g, '').slice(0, 4); clientJoin(S.ui.joinCode); break;
    case 'solo': saveNick(); startSolo(); break;
    case 'bots-': S.ui.bots = Math.max(3, S.ui.bots - 1); render(); break;
    case 'bots+': S.ui.bots = Math.min(11, S.ui.bots + 1); render(); break;
    case 'rules': S.ui.sheet = { k: 'rules' }; render(); break;
    case 'close': S.ui.sheet = null; render(); break;
    case 'copy': copyText(S.code); break;
    case 'addbot': if (H.lobby.length < 12) { H.lobby.push({ nick: botName(), bot: true, cid: 'bot' + rid() }); hostChanged(); } break;
    case 'rmbot': H.lobby = H.lobby.filter((x) => x.cid !== el.dataset.cid); hostChanged(); break;
    case 'start': startHostedGame(); break;
    case 'leave': leaveRoom(); break;
    case 'again':
      if (S.role === 'solo') { H.lobby = H.G.players.map((p) => ({ nick: p.nick, bot: p.bot, cid: p.cid, host: p.cid === S.cid })); startHostedGame(); }
      else { H.G = null; S.mode = 'lobby'; H.lobby = H.lobby.filter((x) => x.bot || x.host || H.conn[x.cid] !== false); hostChanged(); }
      break;
    case 'openlog': S.ui.sheet = { k: 'log' }; render(); break;
    case 'openchat': S.ui.sheet = { k: 'chat' }; S.ui.unread = 0; render(); break;
    case 'role': S.ui.sheet = { k: 'mine' }; render(); break;
    case 'pickmin': S.ui.pickMin = !S.ui.pickMin; render(); break;
    case 'sg': {
      SND.play('tap');
      const pv = S.priv, mode = stageMode();
      if (!pv || pid == null) break;
      if (mode === 'witch') { const cur = S.ui.sgp != null ? S.ui.sgp : pv.mp; if (cur === pid) S.ui.sgc = pid; else { S.ui.sgp = pid; doAct({ t: 'prop', target: pid }); } }
      else if (mode === 'con') { if (pid === me) { toast('ما تقدر تحمي نفسك'); break; } if (S.ui.sgsel === pid) S.ui.sgc = pid; else S.ui.sgsel = pid; }
      else if (mode === 'guessW' || mode === 'guessC') {
        const g = pv.gu;
        if (g && g.f) { toast('ثبّت تخمينك خلاص'); break; }
        if (mode === 'guessW' && pid === me) break;
        const cur = S.ui.sgg != null ? S.ui.sgg : g ? g.t : null;
        if (cur === pid) S.ui.sgc = pid; else { S.ui.sgg = pid; doAct({ t: 'guess', target: pid }); }
      }
      render(); break;
    }
    case 'sgok': {
      const t = S.ui.sgc, mode = stageMode();
      S.ui.sgc = null;
      if (t == null) break;
      if (mode === 'witch') doAct({ t: 'lock', target: t });
      else if (mode === 'con') doAct({ t: 'shield', target: t });
      else if (mode === 'guessW' || mode === 'guessC') doAct({ t: 'guess', target: t, fix: 1 });
      render(); break;
    }
    case 'sgno': S.ui.sgc = null; render(); break;
    case 'snd': SND.toggle(); lastHTML.screen = null; render(); break;
    case 'qr': if (pub && S.priv) { doAct({ t: 'chat', text: el.dataset.t }); SND.play('tap'); } break;
    case 'tipok': { const s = tipsSeen(); s[S.ui.coach] = 1; store.set('lail.tips', JSON.stringify(s)); S.ui.coach = null; updateCoach(); break; }
    case 'tipsoff': store.set('lail.tipsOff', '1'); S.ui.learn = false; S.ui.coach = null; updateCoach(); break;
    case 'learn': saveNick(); if (!S.nick) { S.nick = 'متعلم'; } store.set('lail.tips', '{}'); store.set('lail.tipsOff', ''); S.ui.learn = true; S.ui.bots = 4; startSolo(); break;
    case 'resume': { const v = SESS.read(false); if (v) resumeSession(v); break; }
    case 'install': installApp(); break;
    case 'introok': cdClose(); S.ui.intro = false; if (S.pub && S.pub.sg && S.pub.sg.k === 'ready') doAct({ t: 'ready' }); render(); break;
    case 'char': {
      if (pid != null) { const m = tableMode(); if (m && ['card', 'peek', 'will', 'dpick', 'npick', 'steal', 'fitna', 'heal'].includes(m.k) && (pid !== me || (m.k === 'fitna' && m.step === 0))) { seatTap(pid); break; } S.ui.sheet = { k: 'char', pid }; }
      else S.ui.sheet = { k: 'char', c: el.dataset.c };
      render(); break;
    }
    case 'seatinfo': S.ui.sheet = { k: 'seat', pid }; render(); break;
    case 'useab': {
      const P = pl(me); S.ui.sheet = null;
      if (P && abReady()) useAbility();
      render(); break;
    }
    case 'ovmin': S.ui.ovMin = !S.ui.ovMin; render(); break;
    case 'seat': seatTap(pid); break;
    case 'tcard': {
      const m = tableMode(); const i = +el.dataset.i;
      if (m && m.k === 'reveal' && m.tg === pid && pl(pid).tr[i] === '?') { if (S.ui.rvSent != null) break; S.ui.rvSent = i; rvPre(pid); doAct({ t: 'reveal', idx: i }); break; }
      if (m && m.k !== 'reveal') { seatTap(pid); break; }
      S.ui.sheet = { k: 'tcard', pid, i }; render(); break;
    }
    case 'fcard': { const m = tableMode(); if (m && m.k !== 'reveal') { seatTap(pid); break; } S.ui.sheet = { k: 'fcard', pid, k2: +el.dataset.k }; render(); break; }
    case 'deckinfo': S.ui.sheet = { k: 'info', title: 'كومة السحب', body: `فيها ${AR(pub.dk)} ${pub.dk === 1 ? 'ورقة' : 'أوراق'}. ورقة الليل دايم تحت، والمؤامرة مخلوطة بالنص.` }; render(); break;
    case 'discinfo': S.ui.sheet = { k: 'info', title: 'المحروق', body: `${AR(pub.ds)} ${pub.ds === 1 ? 'ورقة' : 'أوراق'} انلعبت أو انحرقت${pub.dt ? `، وآخرها «${LE.T[pub.dt].n}»` : ''}. بعد كل ليل ترجع تنخبص للسحب.` }; render(); break;
    case 'card': {
      const id = +el.dataset.id, t = el.dataset.t;
      const myTurn = pub.ph === 'turn' && !pub.pd && pub.turn === me && (pub.tm === 'choose' || pub.tm === 'play') && pl(me).a;
      if (!myTurn) { S.ui.sheet = { k: 'hcard', t }; render(); break; }
      if (S.ui.tg && S.ui.tg.id === id) { S.ui.tg = null; render(); break; }
      S.ui.tg = { k: 'card', id, t, step: 0, t1: null }; S.ui.ovMin = false;
      render(); break;
    }
    case 'cancel': S.ui.tg = null; render(); break;
    case 'willcard': if (pub.pd && pub.pd.tg != null) doAct({ t: 'will', target: pub.pd.tg, idx: +el.dataset.i }); break;
    case 'amnesty': S.ui.sheet = null; doAct({ t: 'amnesty' }); render(); break;
    case 'curpick': { const sh = S.ui.sheet; doAct({ t: 'play', card: sh.id, target: sh.t1, c2i: +el.dataset.k }); S.ui.sheet = null; render(); break; }
    case 'draw': doAct({ t: 'draw' }); break;
    case 'end': doAct({ t: 'end' }); break;
    case 'peek': S.ui.tg = S.ui.tg && S.ui.tg.k === 'peek' ? null : { k: 'peek' }; render(); break;
    case 'reveal': if (S.ui.rvSent != null) break; S.ui.rvSent = +el.dataset.i; if (pub.pd) rvPre(pub.pd.tg); doAct({ t: 'reveal', idx: +el.dataset.i }); render(); break;
    case 'nrole': S.ui.nrole = el.dataset.r; render(); break;
    case 'confess': doAct({ t: 'confess', idx: +el.dataset.i }); break;
    case 'modalok': S.ui.modalQ.shift(); render(); break;
    case 'auto': { const P = H.G && H.G.players[pid]; if (P) { P.auto = !P.auto; H.awSig = ''; hostChanged(); } break; }
  }
}
function saveNick() { const el = document.getElementById('nick'); if (el) { S.nick = cleanNick(el.value); store.set('lail.nick', S.nick); } }
function copyText(t) { try { navigator.clipboard.writeText(t).then(() => toast('انسخ الرمز'), () => toast('الرمز: ' + t)); } catch (e) { toast('الرمز: ' + t); } }
function onSubmit(e) {
  const f = e.target.closest('[data-form]');
  if (!f) return;
  e.preventDefault();
  const inp = document.getElementById(f.dataset.in || 'chatIn');
  const txt = inp ? inp.value.trim() : '';
  if (!txt) return;
  doAct({ t: 'chat', text: txt });
  inp.value = '';
}
function onInput(e) {
  if (e.target.id === 'nick') { S.nick = cleanNick(e.target.value); store.set('lail.nick', S.nick); }
  if (e.target.id === 'joinCode') S.ui.joinCode = latinDigits(e.target.value).replace(/\D/g, '').slice(0, 4);
}
function onChange(e) { if (e.target.id === 'timer') { H.opts.timer = +e.target.value; hostChanged(); } }

/* ================= boot ================= */
function boot() {
  root = document.getElementById('app');
  toastBox = document.getElementById('toasts');
  document.body.insertAdjacentHTML('afterbegin', PORTRAITS.defs);
  root.addEventListener('click', onClick);
  document.getElementById('sheet').addEventListener('click', (e) => { if (e.target.classList.contains('scrim')) { S.ui.sheet = null; render(); return; } onClick(e); });
  document.getElementById('modal').addEventListener('click', onClick);
  document.getElementById('coach').addEventListener('click', onClick);
  document.getElementById('sheet').addEventListener('submit', onSubmit);
  root.addEventListener('submit', onSubmit);
  root.addEventListener('input', onInput);
  root.addEventListener('change', onChange);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { if (S.ui.sheet) { S.ui.sheet = null; render(); } else if (S.ui.tg) { S.ui.tg = null; render(); } } });
  let rt = null; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { lastHTML.screen = null; render(); if (CD.ph === 'pick') cdFan(false); }, 150); });
  S.ui.seenFx = -1;
  render();
  setInterval(() => {
    const el = document.querySelector('.timer:not(.sgt)');
    if (el && S.pub && S.pub.tl != null) { const rem = Math.max(0, S.pub.tl - Math.floor((Date.now() - S.ui.recv) / 1000)); el.textContent = AR(rem); }
    const sg = S.pub && S.pub.sg;
    if (sg && sg.k !== 'ready') {
      const rem = sgLeft(), s = AR(sgSecs());
      document.querySelectorAll('.sgt, .sg-time b').forEach((e) => { if (e.textContent !== s) e.textContent = s; });
      const r = document.querySelector('.sg-time:not(.wait)');
      if (r) { r.style.setProperty('--p', Math.min(1, rem / sg.d).toFixed(3)); r.classList.toggle('low', rem < 5000); }
    }
  }, 250);
  if (window.claude && typeof window.claude.use === 'function') {
    const resume = () => { const v = SESS.read(true); if (v) resumeSession(v); };
    window.claude.use('room').then((r) => { NET.room = r; S.netStatus = r ? 'ok' : 'none'; render(); resume(); }).catch(() => { S.netStatus = 'none'; render(); resume(); });
  } else { S.netStatus = 'none'; const v = SESS.read(true); if (v) resumeSession(v); }
  C.init();
}
boot();
